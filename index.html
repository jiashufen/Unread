<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UNREAD Legal Pages</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #06090c;
      --panel: rgba(20, 24, 29, 0.94);
      --line: rgba(255, 255, 255, 0.08);
      --text: #f3f7fb;
      --text-soft: rgba(243, 247, 251, 0.72);
      --accent: #20d5c0;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at bottom right, rgba(32, 213, 192, 0.14), transparent 28%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: min(720px, 100%);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 28px 22px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--text-soft);
      margin-bottom: 12px;
    }

    .brand::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 12px rgba(32, 213, 192, 0.45);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(34px, 5vw, 48px);
      font-weight: 600;
    }

    p {
      margin: 0;
      color: var(--text-soft);
      font-size: 15px;
      line-height: 1.8;
    }

    .links {
      display: grid;
      gap: 14px;
      margin-top: 24px;
    }

    a {
      display: block;
      padding: 18px 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.02);
      color: var(--text);
      text-decoration: none;
      transition: border-color 160ms ease, transform 160ms ease;
    }

    a:hover {
      border-color: rgba(32, 213, 192, 0.4);
      transform: translateY(-1px);
    }

    .title {
      display: block;
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .sub {
      color: var(--text-soft);
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">UNREAD Legal</div>
    <h1>公开说明页面</h1>
    <p>这里是供 Google Play 审核与用户查看的公开页面入口。当前包含隐私政策与删除账号说明。</p>

    <div class="links">
      <a href="./privacy.html">
        <span class="title">隐私政策</span>
        <span class="sub">说明 UNREAD 如何收集、使用、保存和删除与服务相关的数据。</span>
      </a>
      <a href="./delete-account.html">
        <span class="title">删除账号说明</span>
        <span class="sub">说明用户如何在应用内删除账号，以及删除后会处理哪些数据。</span>
      </a>
    </div>
  </main>
</body>
</html>
